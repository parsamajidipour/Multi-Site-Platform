server {
    listen 80;
    listen 443 ssl;
    server_name example.localhost;
    ssl_certificate /etc/nginx/certs/dev.localhost.crt;
    ssl_certificate_key /etc/nginx/certs/dev.localhost.key;

    location /api/ {
        proxy_pass http://cms-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host cms.example.localhost;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://main_site:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

